<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pignatari — Ultime 20 gare</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --elevated: #23273a;
    --text: #e2e8f0;
    --muted: #8892a4;
    --accent: #60a5fa;
    --ok: #34d399;
    --border: #2d3348;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 14px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    border: 1px solid var(--border);
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.1; margin: 4px 0 2px; }
  .stat-sub { font-size: 11px; color: var(--muted); }
  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  thead { background: var(--elevated); }
  th {
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr.best { background: color-mix(in srgb, var(--ok) 8%, transparent); }
  tr.best td:first-child { border-left: 3px solid var(--ok); }
  tr:not(.best) td:first-child { border-left: 3px solid transparent; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block;
    background: var(--ok);
    color: #0f1117;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 700;
  }
  .var-pos { color: #f87171; font-size: 12px; }
  .var-neg { color: var(--ok); font-size: 12px; }
  .var-neu { color: var(--muted); font-size: 12px; }
  .link-cell a {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    opacity: 0.8;
  }
  .link-cell a:hover { opacity: 1; text-decoration: underline; }
  .legend {
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot-ok { width: 10px; height: 10px; background: var(--ok); border-radius: 2px; display: inline-block; flex-shrink: 0; }
</style>
</head>
<body>

<div class="subtitle">Aggiornato al 11/10/2026 · Stagione 2026</div>

<div class="summary" id="summary"></div>

        <th class="num">Var.</th>

const avgStbl = best8.reduce((s,d) => s + d.stbl, 0) / best8.length;
const bestSD = Math.min(...best8.map(d => d.sd));
const currentIdx = data[0].idx;

document.getElementById("summary").innerHTML = `
  <div class="stat-card">

const tbody = document.getElementById("rows");
data.forEach(d => {
  const tr = document.createElement("tr");
  if (d.top8) tr.className = "best";
  const varClass = d.var < 0 ? "var-neg" : d.var > 0 ? "var-pos" : "var-neu";
  const varStr = d.var === 0 ? "—" : (d.var > 0 ? "+" : "") + d.var.toFixed(1);
  const noteTitle = d.note ? ` title="${d.note}"` : "";
  tr.innerHTML = `
    <td>${d.n}</td>
    <td>${d.data}</td>
    <td${noteTitle}>${d.gara}${d.note ? ' ⚠️' : ''}</td>
    <td>${d.circolo}</td>
    <td class="num">${d.stbl}</td>
    <td class="num">${d.ags}</td>
    <td class="num">${d.pcc !== 0 ? d.pcc : '—'}</td>
    <td class="num">${d.sd.toFixed(1)}</td>
    <td class="num">${d.idx.toFixed(1)}</td>
    <td class="num"><span class="${varClass}">${varStr}</span></td>
    <td>${d.top8 ? '<span class="badge">★ TOP 8</span>' : ''}</td>

  `;
  tbody.appendChild(tr);

</script>
</body>
</html>
