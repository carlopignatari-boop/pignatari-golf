<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pignatari — Ultime 20 gare</title>
<style>
  :root{
    --bg:#0f1117;--card:#1a1d27;--elevated:#23273a;--text:#e2e8f0;--muted:#8892a4;
    --accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--border:#2d3348;--radius:10px;
    --sim:#a78bfa;--proj:#fb923c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;font-size:14px;min-height:100vh}
  h1{font-size:20px;font-weight:700;margin-bottom:4px}
  .subtitle{color:var(--muted);font-size:12px;margin-bottom:14px}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .btn{
    padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:var(--elevated);color:var(--text);
    transition:all .2s;display:inline-flex;align-items:center;gap:6px
  }
  .btn:hover{opacity:.85}
  .btn-back{border-color:var(--muted);color:var(--muted);display:none}
  .btn-sim.active{background:color-mix(in srgb,var(--sim) 20%,transparent);border-color:var(--sim);color:var(--sim)}
  .btn-proj.active{background:color-mix(in srgb,var(--proj) 20%,transparent);border-color:var(--proj);color:var(--proj)}

  /* pannello proiezione */
  .proj-panel{
    display:none;margin-bottom:16px;
    background:color-mix(in srgb,var(--proj) 8%,transparent);
    border:1px solid color-mix(in srgb,var(--proj) 35%,transparent);
    border-radius:var(--radius);padding:14px 16px;
  }
  .proj-panel.visible{display:block}
  .proj-panel h3{font-size:13px;font-weight:700;color:var(--proj);margin-bottom:10px}
  .proj-fields{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
  .proj-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
  .proj-field input{
    background:var(--elevated);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;border-radius:6px;font-size:14px;font-weight:600;width:90px;
  }
  .proj-field input:focus{outline:none;border-color:var(--proj)}
  .proj-field.wide input{width:120px}
  .btn-calc{
    padding:7px 14px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;
    border:none;background:var(--proj);color:#0f1117;
  }
  .proj-result{font-size:12px;color:var(--proj);margin-top:8px;line-height:1.7;display:none}
  .proj-result.visible{display:block}

  /* banner modalità */
  .mode-banner{
    display:none;border-radius:var(--radius);padding:9px 14px;font-size:12px;line-height:1.6;margin-bottom:14px;
  }
  .mode-banner.sim{display:block;background:color-mix(in srgb,var(--sim) 8%,transparent);border:1px solid color-mix(in srgb,var(--sim) 35%,transparent);color:var(--sim)}
  .mode-banner.proj{display:block;background:color-mix(in srgb,var(--proj) 8%,transparent);border:1px solid color-mix(in srgb,var(--proj) 35%,transparent);color:var(--proj)}

  /* summary */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .stat-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);transition:border-color .2s}
  .stat-card.hi{border-color:var(--sim)} .stat-card.hi2{border-color:var(--proj)}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat-value{font-size:26px;font-weight:800;color:var(--accent);line-height:1.1;margin:4px 0 2px;transition:color .2s}
  .stat-value.hi{color:var(--sim)} .stat-value.hi2{color:var(--proj)}
  .stat-sub{font-size:11px;color:var(--muted)}

  /* tabella */
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;min-width:700px}
  thead{background:var(--elevated)}
  th{padding:8px 10px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.best{background:color-mix(in srgb,var(--ok) 8%,transparent)}
  tr.best td:first-child{border-left:3px solid var(--ok)}
  tr.sim-best{background:color-mix(in srgb,var(--sim) 8%,transparent)}
  tr.sim-best td:first-child{border-left:3px solid var(--sim)}
  tr.proj-best{background:color-mix(in srgb,var(--proj) 8%,transparent)}
  tr.proj-best td:first-child{border-left:3px solid var(--proj)}
  tr.out-scope{opacity:.35}
  tr:not(.best):not(.sim-best):not(.proj-best) td:first-child{border-left:3px solid transparent}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;color:#0f1117}
  .b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-sim{background:var(--sim)} .b-proj{background:var(--proj)}
  .var-pos{color:#f87171;font-size:12px}.var-neg{color:var(--ok);font-size:12px}.var-neu{color:var(--muted);font-size:12px}
  .link-cell a{color:var(--accent);text-decoration:none;font-size:12px;opacity:.8}
  .link-cell a:hover{opacity:1;text-decoration:underline}
  .legend{margin-top:14px;font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .leg-item{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  .pending-note{margin-top:14px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--warn);line-height:1.6}
</style>
</head>

// ── Calcolo top8 e stats ──────────────────────────────────────────────

function top8From(perimetro) {
  const sorted = [...perimetro].sort((a,b) => a._sd - b._sd);
  return new Set(sorted.slice(0,8).map(g => g._key));
}

function calcStats(perimetro, top8ids) {
  const best = perimetro.filter(g => top8ids.has(g._key));
  if (!best.length) return {};
  const avgSD = best.reduce((s,g)=>s+g._sd,0)/best.length;
  const stbls = best.map(g=>parseFloat(g.stbl)).filter(v=>!isNaN(v));
  return {
    n: best.length,
    avgSD: avgSD.toFixed(2),
    bestSD: Math.min(...best.map(g=>g._sd)).toFixed(1),
    avgStbl: stbls.length ? (stbls.reduce((s,v)=>s+v,0)/stbls.length).toFixed(1) : '—',
  };
}

    }
    display = [
      ...(projRow ? [{...projRow, _key: 'PROJ', n: '★', data:'—', gara:'GARA PROIETTATA',
                       circolo:'—', ags: projRow.ags, sd_est: projRow.sd_est,
                       link:'#', pending:false, top8:false, virtual:true}] : []),
      ...RAW.map(g => ({...g, _key: g.n}))
    ];
  }

  const top8ids = top8From(perimetro);
  return {perimetro, display, top8ids, outKey};
}

// ── Render ────────────────────────────────────────────────────────────

function render() {
  const {perimetro, display, top8ids, outKey} = buildDataset();
  const stats = calcStats(perimetro, top8ids);
  const idxFig = RAW.filter(g => !g.pending)[0]?.idxN ?? '—';

  const hi  = mode === 'sim'  ? 'hi'  : mode === 'proj' ? 'hi2' : '';
  const hiv = mode === 'sim'  ? 'hi'  : mode === 'proj' ? 'hi2' : '';

  // Summary
  document.getElementById('summary').innerHTML = `
    <div class="stat-card ${hi}">
      <div class="stat-label">Gare nel calcolo</div>
      <div class="stat-value ${hiv}">${stats.n}<span style="font-size:14px;color:var(--muted)">/20</span></div>
      <div class="stat-sub">migliori 8 SD</div>
    </div>
    <div class="stat-card ${hi}">
      <div class="stat-label">Media SD — Top 8</div>
      <div class="stat-value ${hiv}">${stats.avgSD}</div>
      <div class="stat-sub">Score Differenziale medio</div>
    </div>
    <div class="stat-card ${hi}">
      <div class="stat-label">Miglior SD</div>
      <div class="stat-value ${hiv}">${stats.bestSD}</div>
      <div class="stat-sub">performance migliore</div>
    </div>
    <div class="stat-card ${hi}">
      <div class="stat-label">Media Stbl — Top 8</div>
      <div class="stat-value ${hiv}">${stats.avgStbl}</div>
      <div class="stat-sub">punti Stableford medi</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Index attuale FIG</div>
      <div class="stat-value">${idxFig}</div>
      <div class="stat-sub">ultimo elaborato</div>
    </div>
  `;

  // Banner modalità
  const banner = document.getElementById('modeBanner');
  if (mode === 'sim') {
    const pend = RAW.find(g => g.pending && g.sd_est != null);
    const outRow = RAW.find(g => g.n === outKey);
    banner.className = 'mode-banner sim';
    banner.innerHTML = `🔮 <strong>Simulazione gara odierna</strong> — SD stimato per <strong>${pend?.gara}</strong>: <strong>${pend?.sd_est?.toFixed(1)}</strong> (formula WHS: (${pend?.ags?.toFixed(0)} AGS − ${pend?.cr} CR) × 113 / ${pend?.sr} SR). Esce dal perimetro: <strong>${outRow?.gara ?? '—'}</strong> (SD ${outRow?.sd?.toFixed(1)}).`;
  } else if (mode === 'proj' && projRow) {
    const outRow = RAW.find(g => g.n === outKey);
    banner.className = 'mode-banner proj';
    banner.innerHTML = `📐 <strong>Proiezione</strong> — SD stimato: <strong>${projRow.sd_est.toFixed(1)}</strong> (Stbl ${projRow.stbl}, AGS ${projRow.ags}, CR ${projRow.cr}, SR ${projRow.sr}). Esce: <strong>${outRow?.gara ?? '—'}</strong> (SD ${outRow?.sd?.toFixed(1)}).`;
  } else {
    banner.className = 'mode-banner';
    banner.innerHTML = '';
  }

  // Tabella
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  display.forEach(g => {
    const isBest = top8ids.has(g._key);
    const isOut  = g.n === outKey;
    const isVirt = !!g.virtual;

    let trCls = '';
    if (isOut) trCls = 'out-scope';
    else if (isBest && mode === 'proj') trCls = 'proj-best';
    else if (isBest && mode === 'sim')  trCls = 'sim-best';
    else if (isBest) trCls = 'best';

    const var_ = g.var || 0;
    const vc = var_ < 0 ? 'var-neg' : var_ > 0 ? 'var-pos' : 'var-neu';
    const vs = var_ === 0 ? '—' : (var_ > 0 ? '+' : '') + var_.toFixed(1);

    // Cella SD
    let sdCell;
    if (isVirt) {
      sdCell = `<span class="badge b-proj">${g.sd_est.toFixed(1)} ~</span>`;
    } else if (mode === 'sim' && g.pending && g.sd_est != null) {
      sdCell = `<span class="badge b-sim">${g.sd_est.toFixed(1)} ~</span>`;
    } else if (g.pending) {
      sdCell = `<span class="badge b-warn">?</span>`;
    } else {
      sdCell = g.sd != null ? g.sd.toFixed(1) : '—';
    }

    // Cella stato
    let statusCell;
    if (isVirt) statusCell = `<span class="badge b-proj">PROIEZ.</span>`;
    else if (isBest && mode === 'sim')  statusCell = `<span class="badge b-sim">★ SIM</span>`;
    else if (isBest && mode === 'proj') statusCell = `<span class="badge b-proj">★ SIM</span>`;
    else if (isBest) statusCell = `<span class="badge b-ok">★ TOP 8</span>`;
    else if (isOut)  statusCell = `<span style="color:var(--muted);font-size:11px">↩ esce</span>`;
    else statusCell = '';

    const pcc  = g.pcc  != null ? g.pcc : '—';
    const stbl = g.stbl != null ? g.stbl : '—';
    const ags  = g.ags  != null ? Math.round(g.ags) : '—';
    const idxN = g.idxN != null ? g.idxN.toFixed(1) : '—';
    const link = g.link && g.link !== '#' ? `<a href="${g.link}" target="_blank" rel="noopener noreferrer">↗ scheda</a>` : '—';

    const tr = document.createElement('tr');
    if (trCls) tr.className = trCls;
    tr.innerHTML = `
      <td>${g.n}</td><td>${g.data}</td><td>${g.gara}</td><td>${g.circolo}</td>
      <td class="num">${stbl}</td><td class="num">${ags}</td><td class="num">${pcc}</td>
      <td class="num">${sdCell}</td><td class="num">${idxN}</td>
      <td class="num"><span class="${vc}">${vs}</span></td>
      <td>${statusCell}</td>
      <td class="link-cell">${link}</td>
    `;
    tbody.appendChild(tr);
  });

  // Legend
  const leg = document.getElementById('legend');
  leg.innerHTML = `
    <div class="leg-item"><span class="dot" style="background:var(--ok)"></span><span>Top 8 reali</span></div>
    ${mode==='sim'  ? '<div class="leg-item"><span class="dot" style="background:var(--sim)"></span><span>Top 8 simulate</span></div>' : ''}
    ${mode==='proj' ? '<div class="leg-item"><span class="dot" style="background:var(--proj)"></span><span>Top 8 proiettate</span></div>' : ''}
    <div class="leg-item"><span class="badge b-warn" style="font-size:10px">?</span><span>SD non ancora elaborato da FIG</span></div>
    ${mode!=='real' ? '<div class="leg-item"><span style="color:var(--muted);font-size:12px">↩ esce</span><span>Gara che esce dal perimetro delle 20</span></div>' : ''}
  `;

  // Nota pending (solo modalità reale)
  const pending = RAW.filter(g => g.pending);
  const noteEl = document.getElementById('pendingNote');
  if (mode === 'real' && pending.length) {
    noteEl.innerHTML = `<div class="pending-note">⚠️ SD non ancora elaborato da FIG per: <strong>${pending.map(g=>g.gara).join(', ')}</strong>. Non incluse nel perimetro delle 20 gare.</div>`;
  } else {
    noteEl.innerHTML = '';
  }

  // Pulsanti
  document.getElementById('btnBack').style.display = mode !== 'real' ? '' : 'none';
  document.getElementById('btnSim').classList.toggle('active', mode === 'sim');
  document.getElementById('btnProj').classList.toggle('active', mode === 'proj');
  document.getElementById('projPanel').classList.toggle('visible', mode === 'proj');
}

// ── Azioni pulsanti ───────────────────────────────────────────────────

function goReal() {
  mode = 'real';
  projRow = null;
  document.getElementById('projResult').className = 'proj-result';
  render();
}

function toggleSim() {
  mode = mode === 'sim' ? 'real' : 'sim';
  render();
}

function toggleProj() {
  if (mode === 'proj') {
    goReal();
  } else {
    mode = 'proj';
    render();
    document.getElementById('projStbl').focus();
  }
}

function calcProj() {
  const stbl = parseFloat(document.getElementById('projStbl').value);
  const agsRaw = document.getElementById('projAgs').value;
  const cr  = parseFloat(document.getElementById('projCr').value) || CR_DEF;
  const sr  = parseFloat(document.getElementById('projSr').value) || SR_DEF;

  // AGS: se non inserito, lo calcolo da Stbl (AGS = Par + HCP - Stbl, approssimato)
  // Usiamo: AGS ≈ cr + (par - stbl) = cr + par - stbl
  // In realtà AGS dipende dall'handicap, ma se l'utente non lo inserisce usiamo
  // la relazione inversa: SD = (AGS - CR) * 113 / SR → AGS = (SD * SR/113) + CR
  // Quindi chiediamo AGS direttamente. Se vuoto, stima da stbl:
  // Assumiamo par=72 e netto = stbl - 36 rispetto a scratch.
  let ags;
  if (agsRaw.trim() === '') {
    // Stima grezza: AGS = par + (36 - stbl) → se stbl=36 → AGS=par=72
    ags = 72 + (36 - stbl);
  } else {
    ags = parseFloat(agsRaw);
  }

  if (isNaN(stbl) || isNaN(ags) || isNaN(cr) || isNaN(sr) || sr <= 0) {
    document.getElementById('projResult').className = 'proj-result visible';
    document.getElementById('projResult').innerHTML = '⚠️ Inserisci almeno lo Stableford.';
    return;
  }

  const sdEst = parseFloat(((ags - cr) * (113 / sr)).toFixed(1));

  projRow = {
    stbl: stbl,
    ags: ags,
    cr: cr,
    sr: sr,
    sd_est: sdEst,
    idxN: null,
    idxV: null,
    var: 0,
    pending: false,
    link: '#',
    top8: false,
  };

  // Anteprima risultato
  const withSDreal = RAW.filter(g => !g.pending && g.sd != null);
  const perim19 = withSDreal.slice(0,19).map(g=>g.sd);
  const allSDs = [sdEst, ...perim19].sort((a,b)=>a-b);
  const top8SDs = allSDs.slice(0,8);
  const newAvg = (top8SDs.reduce((s,v)=>s+v,0)/8).toFixed(2);
  const oldAvg = (() => {
    const old = withSDreal.slice(0,20).map(g=>g.sd).sort((a,b)=>a-b).slice(0,8);
    return (old.reduce((s,v)=>s+v,0)/8).toFixed(2);
  })();
  const inTop8 = top8SDs.includes(sdEst);
  const exitGara = withSDreal[19];

  document.getElementById('projResult').className = 'proj-result visible';
  document.getElementById('projResult').innerHTML =
    `SD stimato: <strong>${sdEst.toFixed(1)}</strong> &nbsp;|&nbsp; `+
    `${inTop8 ? '✅ <strong>Entra nelle Top 8</strong>' : '❌ Non entra nelle Top 8'} &nbsp;|&nbsp; `+
    `Media Top 8: <strong>${oldAvg} → ${newAvg}</strong> `+
    `(${parseFloat(newAvg) < parseFloat(oldAvg) ? '📉 migliora' : '📈 peggiora'}) `+
    `${exitGara ? `&nbsp;|&nbsp; Esce: <strong>${exitGara.gara}</strong> (SD ${exitGara.sd.toFixed(1)})` : ''}`;

  render();
}

render();
</script>
